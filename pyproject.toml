[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eliana"
version = "0.1.7"
description = "ELIANA (Event Log and Incident Analysis), a log analysis library developed at the Paranal Observatory"
readme = "README.md"
license = { text = "BSD License" }
authors = [
  { name = "Juan Pablo Gil", email = "juanpablo.gil@eso.org" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent"
]
requires-python = ">=3.6.8"
dependencies = [
  "pandas",
  "matplotlib",
  "numpy",
  "scikit-learn",
  "pyarrow",
  "fastparquet",
]

[project.optional-dependencies]
dev = [
  "ruff",
]

[project.urls]
Homepage = "https://github.com/paranal-sw/eliana"
Repository = "https://github.com/paranal-sw/eliana"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
# Target Python version matching the project requirements
target-version = "py38"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) rules
select = ["E", "F", "I"]

# Never enforce line length violations (since this is an existing codebase)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]